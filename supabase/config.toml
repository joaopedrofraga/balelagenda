# Balelagenda Supabase config
# https://supabase.com/docs/guides/cli/config

[project]
# Preencha com o project_id do Dashboard se usar CLI

[api]
enabled = true

[db]
major_version = 15

# Auth custom: login é público; demais validam JWT no código (mesmo secret do projeto)
[functions.login]
verify_jwt = false

[functions.admin-create-user]
verify_jwt = false

[functions.admin-set-password]
verify_jwt = false

[functions.change-password]
verify_jwt = false

[functions.suggest-places]
verify_jwt = false
